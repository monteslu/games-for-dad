name: release

# Build every game's .wasc cart and Android APK on a tag, and attach them to
# the GitHub release.
#
# The two halves cost VERY different amounts, which is why they are separate
# jobs rather than one:
#
#   carts  — pure PACKAGING. A .wasc is a zip of a prebuilt engine.wasm plus
#            the game's Lua source. Nothing compiles. Measured at 0.13s per
#            cart locally, so all six finish in about a second.
#
#   apks   — a real Android build. Gradle + the NDK compile the engine into
#            libmain.so per ABI. That part is expensive ONCE and then cached:
#            a warm rebuild that only swaps the cart asset measured 1.3s. So
#            the gradle/NDK cache is what makes this job reasonable, and the
#            first run after a cache miss will be slow.
#
# Carts are attached even if the APK job fails, because a .wasc runs anywhere
# the wasmcart player runs and is the more portable artifact of the two.

on:
  push:
    tags: ['v*']
  # Manual runs are useful for checking the pipeline without cutting a tag.
  # They upload artifacts but do not touch releases.
  workflow_dispatch:

permissions:
  contents: write        # needed to attach files to the release

jobs:
  carts:
    name: pack .wasc
    runs-on: ubuntu-latest
    steps:
      # The whole history and every tag: the carts' version comes from them
      # (README, "Versions"), and a shallow clone has no tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The packer comes from npm rather than a checkout, so CI never needs
      # the wasmcart source tree. build.sh resolves it via require.resolve.
      # WASMCART_PACK IS EXPORTED EXPLICITLY. build.sh otherwise falls back
      # to `node -e require.resolve('wasmcart/...')`, and Node resolves
      # node_modules upward from the CURRENT DIRECTORY -- which is the
      # game's folder, not the repo root where npm installed it. That
      # fallback works on a dev box only because a node_modules happens to
      # sit somewhere above it; on a clean runner every cart failed with
      # "no packer at ... (npm i wasmcart)".
      #
      # wasmcart 0.39.0 is the first packer that versions a cart from git, and
      # it comes from its GitHub tag until it is on npm.
      - name: install the packer
        run: |
          npm i --no-save --ignore-scripts "github:wasmcart/wasmcart#v0.39.0"
          echo "WASMCART_PACK=$PWD/node_modules/wasmcart/bin/wasmcart-pack.js" >> "$GITHUB_ENV"

      # THE CARTS' VERSION, worked out ONCE, before any build.sh runs. The
      # packer's rule: at a clean v<semver> tag, the tag (v1.2.3 gives 1.2.3);
      # anywhere else <last tag>-dev.g<commit>. A build.sh regenerates the
      # committed assets.index files, so a later game would see a changed
      # tracked file and call itself a dev build; every build.sh passes
      # CART_VERSION instead.
      - name: the carts' version
        run: |
          v="$(node --input-type=module -e "
            import { resolveCartVersion } from '$PWD/node_modules/wasmcart/src/cartVersion.js';
            const r = resolveCartVersion({ dirs: [process.cwd()] });
            if (r.error) { console.error(r.error); process.exit(1); }
            process.stdout.write(r.version);")"
          echo "carts are version $v"
          echo "CART_VERSION=$v" >> "$GITHUB_ENV"

      # The ENGINE is a COMMITTED binary in the wasmcart-lua repo
      # (build/engine.wasm), not an npm package and not something CI builds.
      # A checkout is the whole story: no emcc, no compilation.
      - name: check out wasmcart-lua (carries the prebuilt engine)
        uses: actions/checkout@v4
        with:
          repository: wasmcart/wasmcart-lua
          path: wasmcart-lua

      - name: point the build scripts at it
        run: echo "WASMCART_LUA=$PWD/wasmcart-lua" >> "$GITHUB_ENV"

      - name: pack every cart
        run: |
          set -e
          # Every game has a build.sh (the card games pack the engine they
          # commit), so every cart is packed here with CART_VERSION.
          mkdir -p dist
          for d in */; do
            g="${d%/}"
            # SKIP dist/ ITSELF. `for d in */` matches every directory in
            # the repo, and once dist/ exists and holds a cart, the copy
            # below tries to copy a file onto itself and cp exits 1 --
            # taking the whole release with it after the first game
            # packed successfully.
            [ "$g" = "dist" ] && continue
            [ -f "$g/build.sh" ] && { echo "packing $g"; (cd "$g" && ./build.sh); }
            for c in "$g"/*.wasc; do [ -f "$c" ] && cp "$c" dist/; done
          done
          ls -la dist/

      # A release's carts must say the release's version. A cart built from a
      # shallow clone, a dirty tree or an old packer says something else
      # (0.0.0-dev..., 1.2.0-dev..., 1.0.0), and this stops it being attached.
      - name: every cart carries the tag's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          bad=0; n=0
          for c in dist/*.wasc; do
            got="$(unzip -p "$c" manifest.json | jq -r .version)"
            echo "$c: $got"
            n=$((n + 1))
            [ "$got" = "$want" ] || { echo "::error::$c says version $got; the tag is $GITHUB_REF_NAME"; bad=1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no carts in dist/"; bad=1; }
          exit $bad

      - uses: actions/upload-artifact@v4
        with:
          name: carts
          path: dist/*.wasc

      - name: attach carts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wasc

  apks:
    name: build APKs
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: carts`. The two are independent, and a cart
    # failure should not hide an APK failure (or vice versa).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # wasmcart-android-lua is a separate repo holding the Android host and
      # the build script. It carries the engine as a submodule.
      - name: check out the android host
        uses: actions/checkout@v4
        with:
          repository: wasmcart/wasmcart-android-lua
          path: android-host
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # ImageMagick, for the per-game launcher icons. build-game-apk.sh
      # resizes each game's icon.png into the five mipmap densities with
      # `magick`, and the runner does not ship it -- the APK job died with
      # "magick: command not found" after the native build had already
      # succeeded. Without it every game would fall back to the repo's
      # default icon, which is worse than a slow install.
      - name: install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # THE CACHE IS THE WHOLE POINT. Compiling libmain.so per ABI is the
      # only expensive step; everything after it is Gradle swapping one asset
      # and re-zipping. Key on the engine submodule's SHA so the cache is
      # reused across game changes but correctly invalidated when the engine
      # itself moves.
      - name: cache gradle + NDK output
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-host/app/.cxx
          key: ndk-${{ runner.os }}-${{ hashFiles('android-host/deps/wasmcart-lua/**/*.c', 'android-host/deps/wasmcart-lua/**/*.h') }}
          restore-keys: ndk-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # WASMCART_PACK IS EXPORTED EXPLICITLY. build.sh otherwise falls back
      # to `node -e require.resolve('wasmcart/...')`, and Node resolves
      # node_modules upward from the CURRENT DIRECTORY -- which is the
      # game's folder, not the repo root where npm installed it. That
      # fallback works on a dev box only because a node_modules happens to
      # sit somewhere above it; on a clean runner every cart failed with
      # "no packer at ... (npm i wasmcart)".
      #
      # wasmcart 0.39.0 is the first packer that versions a cart from git, and
      # it comes from its GitHub tag until it is on npm.
      - name: install the packer
        run: |
          npm i --no-save --ignore-scripts "github:wasmcart/wasmcart#v0.39.0"
          echo "WASMCART_PACK=$PWD/node_modules/wasmcart/bin/wasmcart-pack.js" >> "$GITHUB_ENV"

      # THE CARTS' VERSION, worked out ONCE, before any build.sh runs. The
      # packer's rule: at a clean v<semver> tag, the tag (v1.2.3 gives 1.2.3);
      # anywhere else <last tag>-dev.g<commit>. A build.sh regenerates the
      # committed assets.index files, so a later game would see a changed
      # tracked file and call itself a dev build; every build.sh passes
      # CART_VERSION instead.
      - name: the carts' version
        run: |
          v="$(node --input-type=module -e "
            import { resolveCartVersion } from '$PWD/node_modules/wasmcart/src/cartVersion.js';
            const r = resolveCartVersion({ dirs: [process.cwd()] });
            if (r.error) { console.error(r.error); process.exit(1); }
            process.stdout.write(r.version);")"
          echo "carts are version $v"
          echo "CART_VERSION=$v" >> "$GITHUB_ENV"

      # SDL and Lua are FETCHED, not vendored: fetch-deps.sh clones a
      # pinned SDL tag and downloads Lua 5.4.7, patching it exactly the
      # way the wasm engine does so both targets compile the same VM.
      # Without this the native build configures and then dies with
      # "Lua not found. Run deps/fetch-deps.sh" -- which it did, after
      # spending a minute and a half on cmake first.
      - name: fetch SDL and Lua
        run: cd android-host && ./deps/fetch-deps.sh

      # Same committed engine as the carts job. The android-host checkout
      # already brings wasmcart-lua in as a submodule, so point at that copy
      # rather than cloning it twice.
      - name: point the build scripts at the engine
        run: echo "WASMCART_LUA=$PWD/android-host/deps/wasmcart-lua" >> "$GITHUB_ENV"

      # ONE native compile for ALL the games.
      #
      # libmain.so is built from the ENGINE's C source and contains nothing
      # game-specific -- the game is an asset (cart.wasc) that Gradle drops
      # in beside it. So compiling it per game would be the same work six
      # times over. The first build below pays for the NDK compile; every
      # build after it reuses .cxx and only re-zips with a different asset,
      # which measured 1.3s locally.
      #
      # This is also why the cache above keys on the ENGINE sources and not
      # on the games: a game-only change should hit the cache and skip the
      # compile entirely.
      - name: build an APK per game
        run: |
          set -e
          mkdir -p dist
          first=1
          for d in */; do
            g="${d%/}"
            [ "$g" = "dist" ] && continue     # see the carts job
            [ -f "$g/build.sh" ] && (cd "$g" && ./build.sh)
            for c in "$g"/*.wasc; do
              [ -f "$c" ] || continue
              if [ "$first" = 1 ]; then
                echo "=== $g (this one pays for the native compile) ==="
                first=0
              else
                echo "=== $g (reusing libmain.so) ==="
              fi
              # NAME THE APK AFTER THE CART, not after the app's label.
              #
              # build-game-apk.sh defaults to a slug of the manifest's
              # `name`, which is the on-device label -- so "5 Card Stud"
              # became 5cardstud.apk beside fivecardstud.wasc, and the same
              # for 7 Card Stud. A release listing where two of nine games
              # sort somewhere else and do not match their cart is a
              # release listing you have to think about.
              #
              # Passing the cart's own basename ties the two together at
              # the source: they cannot drift again, and the app LABEL
              # stays "5 Card Stud", which is the better name on a phone.
              #
              # arm64-v8a is the default (every phone since ~2017). No WC_ABI
              # override: x86_64 is only for the emulator and is not shipped.
              apk="$GITHUB_WORKSPACE/android-host/out/$(basename "$c" .wasc).apk"
              (cd android-host && WC_PHYSICS=ON ./build-game-apk.sh \
                 "$GITHUB_WORKSPACE/$c" "" "$apk")
            done
          done
          cp android-host/out/*.apk dist/ || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      - name: attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
